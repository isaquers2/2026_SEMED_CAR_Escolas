<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diários da Escola - SEMED</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-4 sm:p-6 lg:p-8">

  <div class="max-w-7xl mx-auto space-y-6">

    <!-- BOTÃO VOLTAR -->
    <div>
      <a href="index.html" class="inline-flex items-center gap-2 text-xs font-bold text-slate-600 hover:text-slate-900 bg-white border border-slate-200 px-3.5 py-2 rounded-xl transition shadow-sm">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Voltar para a Lista de Escolas
      </a>
    </div>

    <!-- CABEÇALHO PRINCIPAL DA ESCOLA -->
    <header class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div class="flex items-start gap-4">
        <div class="bg-emerald-100/70 p-3.5 rounded-xl text-emerald-600 flex items-center justify-center">
          <i data-lucide="school" class="w-7 h-7"></i>
        </div>
        <div>
          <div class="flex flex-wrap items-center gap-2 mb-1">
            <span id="badge-zona" class="bg-blue-50 text-blue-600 font-semibold text-xs px-2.5 py-0.5 rounded-full uppercase border border-blue-200/60"></span>
            <span id="badge-regiao" class="bg-slate-100 text-slate-600 font-medium text-xs px-2.5 py-0.5 rounded-full flex items-center gap-1">
              <i data-lucide="map-pin" class="w-3 h-3"></i> <span id="txt-regiao"></span>
            </span>
            <span id="badge-inep" class="bg-slate-100 text-slate-600 font-medium text-xs px-2.5 py-0.5 rounded-full"></span>
          </div>
          <h1 id="txt-nome-escola" class="text-xl sm:text-2xl font-bold text-slate-900 uppercase tracking-tight">Carregando...</h1>
          <p id="txt-subtitulo" class="text-sm text-slate-500 font-medium mt-0.5"></p>
        </div>
      </div>

      <!-- BOTÃO CONTROLE DE GESTÃO -->
      <a id="btn-gestao" href="#" target="_blank" class="w-full md:w-auto bg-amber-400 hover:bg-amber-500 text-slate-900 font-medium px-5 py-3 rounded-xl flex items-center justify-between md:justify-start gap-3 transition shadow-sm group">
        <div class="flex items-center gap-3">
          <div class="bg-amber-500/30 p-2 rounded-lg">
            <i data-lucide="folder-key" class="w-5 h-5 text-slate-900"></i>
          </div>
          <div class="text-left">
            <div class="flex items-center gap-1.5 font-bold text-sm">
              <span id="txt-nome-gestao">Arquivo Geral / Gestão</span>
              <span class="bg-amber-200 text-amber-900 text-[10px] uppercase font-bold px-1.5 py-0.2 rounded">Aviso</span>
            </div>
            <div class="text-xs text-slate-700/80">Acesso Restrito à Equipe Gestora</div>
          </div>
        </div>
        <i data-lucide="external-link" class="w-4 h-4 text-slate-700 group-hover:translate-x-0.5 transition"></i>
      </a>
    </header>

    <!-- FILTROS DE TURNO -->
    <section class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm space-y-3">
      <div id="container-filtros" class="flex flex-wrap gap-2"></div>
      <p class="text-xs text-slate-500 font-medium flex items-center gap-1">
        <i data-lucide="info" class="w-3.5 h-3.5"></i> Clique no botão da turma para abrir o diário no Google Planilhas
      </p>
    </section>

    <!-- LISTA DOS TURNOS E TURMAS -->
    <main id="container-turnos" class="space-y-6"></main>

  </div>

  <script>
    let ESCOLA_ATUAL = null;
    let filtroAtivo = "todos";

    async function carregarEscola() {
      const urlParams = new URLSearchParams(window.location.search);
      const escolaId = urlParams.get('id');

      try {
        const res = await fetch('escolas.json');
        const escolas = await res.json();
        ESCOLA_ATUAL = escolas.find(e => e.id === escolaId) || escolas[0];

        document.title = `${ESCOLA_ATUAL.nome} - Diários Escolares`;

        // Preencher informações no topo
        document.getElementById("txt-nome-escola").innerText = ESCOLA_ATUAL.nome;
        document.getElementById("badge-zona").innerText = `Zona ${ESCOLA_ATUAL.zona}`;
        document.getElementById("txt-regiao").innerText = `REGIÃO: ${ESCOLA_ATUAL.regiao}`;
        document.getElementById("badge-inep").innerText = `# INEP: ${ESCOLA_ATUAL.inep}`;
        
        const totalTurmas = (ESCOLA_ATUAL.turnos || []).reduce((acc, t) => acc + t.turmas.length, 0);
        document.getElementById("txt-subtitulo").innerText = `${totalTurmas} turmas cadastradas • ${ESCOLA_ATUAL.cidadeEstado}`;

        document.getElementById("btn-gestao").href = ESCOLA_ATUAL.controleGestao.link;

        renderizarFiltros(totalTurmas);
        renderizarTurnos();
        lucide.createIcons();
      } catch (err) {
        alert("Erro ao carregar os dados da escola.");
      }
    }

    function renderizarFiltros(totalGeral) {
      const container = document.getElementById("container-filtros");
      let html = `
        <button onclick="aplicarFiltro('todos')" class="px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 ${filtroAtivo === 'todos' ? 'bg-slate-900 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
          Todos os Turnos <span class="px-1.5 py-0.5 rounded-md text-[10px] ${filtroAtivo === 'todos' ? 'bg-slate-700 text-white' : 'bg-slate-200 text-slate-700'}">${totalGeral}</span>
        </button>
      `;

      (ESCOLA_ATUAL.turnos || []).forEach(turno => {
        const ativo = filtroAtivo === turno.id;
        html += `
          <button onclick="aplicarFiltro('${turno.id}')" class="px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 ${ativo ? 'bg-slate-900 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
            <i data-lucide="${turno.icone}" class="w-3.5 h-3.5 ${ativo ? 'text-white' : turno.corIcone}"></i>
            ${turno.nome.split(' ')[1] || turno.nome} 
            <span class="px-1.5 py-0.5 rounded-md text-[10px] ${ativo ? 'bg-slate-700 text-white' : 'bg-slate-200 text-slate-700'}">${turno.turmas.length}</span>
          </button>
        `;
      });

      container.innerHTML = html;
    }

    function aplicarFiltro(id) {
      filtroAtivo = id;
      const totalGeral = ESCOLA_ATUAL.turnos.reduce((acc, t) => acc + t.turmas.length, 0);
      renderizarFiltros(totalGeral);
      renderizarTurnos();
      lucide.createIcons();
    }

    function renderizarTurnos() {
      const container = document.getElementById("container-turnos");
      container.innerHTML = "";

      if (!ESCOLA_ATUAL.turnos || ESCOLA_ATUAL.turnos.length === 0) {
        container.innerHTML = `
          <div class="py-12 text-center bg-white rounded-2xl border border-slate-200 text-slate-400">
            Nenhum turno ou turma cadastrada para esta unidade até o momento.
          </div>
        `;
        return;
      }

      ESCOLA_ATUAL.turnos.forEach(turno => {
        if (filtroAtivo !== "todos" && filtroAtivo !== turno.id) return;
        if (filtroAtivo === "todos" && turno.turmas.length === 0) return;

        const section = document.createElement("section");
        section.className = "bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm space-y-4";

        const turmasHTML = turno.turmas.map(turma => `
          <div class="bg-slate-50/70 hover:bg-white border border-slate-200/80 hover:border-emerald-300 rounded-xl p-4 transition duration-200 group hover:shadow-md flex flex-col justify-between space-y-3">
            <div class="flex items-center gap-2.5">
              <div class="bg-emerald-100/80 text-emerald-600 p-2 rounded-lg">
                <i data-lucide="file-spreadsheet" class="w-5 h-5"></i>
              </div>
              <div>
                <h3 class="font-bold text-slate-900 text-base leading-tight">${turma.nome}</h3>
                <span class="text-xs text-slate-400 font-medium">${turma.etapa || 'Anos Iniciais'}</span>
              </div>
            </div>

            <div class="pt-2 border-t border-slate-200/60 flex items-center justify-between gap-2">
              <a href="${turma.link}" target="_blank" class="inline-flex items-center gap-1.5 text-xs font-bold text-emerald-600 hover:text-emerald-700 group-hover:underline">
                Abrir Diário <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
              </a>
              <span class="text-[11px] font-medium text-slate-400">Google Planilhas</span>
            </div>
          </div>
        `).join("");

        section.innerHTML = `
          <div class="flex items-center justify-between border-b border-slate-100 pb-3">
            <div class="flex items-center gap-2.5">
              <div class="p-2 rounded-lg bg-slate-100">
                <i data-lucide="${turno.icone}" class="w-5 h-5 ${turno.corIcone}"></i>
              </div>
              <h2 class="font-bold text-slate-800 text-lg">${turno.nome}</h2>
              <span class="bg-slate-100 text-slate-600 font-semibold text-xs px-2.5 py-0.5 rounded-full">${turno.turmas.length} turmas</span>
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            ${turmasHTML}
          </div>
        `;

        container.appendChild(section);
      });
    }

    document.addEventListener("DOMContentLoaded", carregarEscola);
  </script>
</body>
</html>
